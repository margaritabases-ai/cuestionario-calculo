<!DOCTYPE html>

<div class="main-container text-center">

    </div>

        <p class="text-secondary font-monospace small">El cuestionario no tiene tiempo limite para ser contestado.</p>
    </div>

    <button class="btn btn-premium btn-green" onclick="prepararQuiz()">Iniciar Cuestionario</button>

<script src="script.js"></script>
